plugins {
    id 'com.android.application'
}
android {
    namespace 'uk.co.swishflip.webv2'
    compileSdk 35

    defaultConfig {
        // Dedicated test identity. Never overwrite the existing SWISH app.
        applicationId 'uk.co.swishflip.webv2.test'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0-test'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
}
