name: SWISH WebView Test APK

on:
  push:
    branches: [main]
    paths:
      - 'android-webview/**'
      - '.github/workflows/build-webview-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-webview:
    name: Build installable SWISHWEB V2 test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout SwishWeb v2
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          echo "Android SDK: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -x "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" || command -v sdkmanager
      - name: Install Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug test APK
        working-directory: android-webview
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare APK download
        run: |
          mkdir -p artifacts
          cp android-webview/app/build/outputs/apk/debug/app-debug.apk artifacts/SWISHWEB-V2-WebView-test.apk
          echo '### SWISHWEB V2 website wrapper' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the **SWISHWEB-V2-WebView-test** artifact, unzip, then install its APK.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The app loads the published SWISH website; there is no extra backend or OTA system.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SWISHWEB-V2-WebView-test
          path: artifacts/SWISHWEB-V2-WebView-test.apk
          retention-days: 14
          if-no-files-found: error
